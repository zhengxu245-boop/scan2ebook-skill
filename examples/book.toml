# scan2ebook 示例配置（以《在祈祷中相遇》为例）。
# 复制到项目根并改名 book.toml，按你的书修改。

[book]
pdf = "books/在祈祷中相遇：与上主成为无话不谈的好友.pdf"
title = "在祈祷中相遇：与上主成为无话不谈的好友"
subtitle = "Here's My Heart, Here's My Hand — Living Fully in Friendship with God"
author = "威廉·贝瑞（William A. Barry, S.J.）著"
translator = "林清华 译"
lang = "zh-CN"          # EPUB 语言
convert = "t2s"         # opencc 转换：t2s/t2sp/s2t/tw2sp/""（空=不转）
ocr_script = "trad"     # OCR 目标字种：trad=繁体原文 / simp=简体
output = "在祈祷中相遇.md"   # 可选，最终 Markdown 文件名（默认用 title）

[models]
base_url = "https://llmapi.paratera.com/v1/chat/completions"
api_key = ""            # 留空则读环境变量 PARATERA_API_KEY 或 DSH 凭据文件
ocr = "GLM-4V-Flash"
proofread = "GLM-4.5-Air"

[ocr]
dpi = 200
max_tokens = 1024       # GLM-4V-Flash 上限；用别的模型可调大
trunc_threshold = 995   # 补全接近此值视为可能截断，触发切半兜底

[proofread]
max_pages = 8           # 每个子块最多页数（大请求易超时，别调太大）
max_tokens = 16384

# 章节单元表（start/end 为 PDF 页码，1-based；level 1=部标题，2=章标题）
